[package]
name = "bamtax"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
csv = "1.4.0"
flate2 = { version = "1.1.9", default-features = false, features = [ "zlib-ng" ] }
gzp = "2.0.2"
num_cpus = "1.17.0"
rust-htslib = "1.0.1"
seq_io = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
