<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bamtax alignment report</title>
  <style>
<!-- BAMTAX:STYLE -->
  </style>
</head>
<body>
<main>
  <header class="page-header">
    <h1>Detected taxa</h1>
    <div class="report-legend" aria-label="Yellow indicates a species-level call">
      <span class="species-swatch" aria-hidden="true"></span>
      <span>Species-level call</span>
    </div>
  </header>
  <div class="report-layout">
    <section class="card taxa-card">
      <div class="toolbar report-toolbar">
        <div class="filter-controls">
          <label class="filter-field">Dataset
            <select id="dataset" aria-label="Dataset">
<!-- BAMTAX:DATASET_OPTIONS -->
            </select>
          </label>
          <label class="filter-field search-field">Taxa
            <input type="search" id="taxon-search" autocomplete="off" placeholder="Name or tax ID">
            <span id="taxon-search-results" class="search-results" hidden></span>
          </label>
          <label class="filter-field search-field">References
            <input type="search" id="reference-search" autocomplete="off" placeholder="Reference name">
            <span id="reference-search-results" class="search-results" hidden></span>
          </label>
        </div>
        <div>
          <button type="button" id="expand">Expand all</button>
          <button type="button" id="collapse">Collapse all</button>
        </div>
      </div>
<!-- BAMTAX:TAXON_PANELS -->
    </section>
    <section class="card krona-card">
      <div class="section-head">
        <h2>Read distribution</h2>
        <div class="view-toggle" role="group" aria-label="Visualization">
          <button type="button" id="show-sankey" class="active" aria-pressed="true">Sankey</button>
          <button type="button" id="show-krona" aria-pressed="false">Krona</button>
        </div>
      </div>
      <p id="sankey-help">Calls are grouped by Bacteria, Archaea, Eukaryota, or Viruses and ordered by count within each group. Hover, focus, or select a group for details. Drag open space to pan.</p>
      <div id="sankey-view">
        <div id="sankey-sample-name"></div>
        <svg id="sankey" role="img" aria-label="Read distribution by species" aria-describedby="sankey-help"></svg>
        <div id="sankey-tooltip" role="tooltip" hidden></div>
      </div>
      <div id="krona-view" hidden>
<!-- BAMTAX:KRONA -->
      </div>
    </section>
  </div>
  <dialog id="extract-dialog">
    <h2>Extract reads</h2>
    <textarea id="extract-command" readonly aria-label="Extract command"></textarea>
    <div class="dialog-actions">
      <span id="copy-status" role="status"></span>
      <button type="button" id="copy-command">Copy command</button>
      <form method="dialog"><button type="submit">Close</button></form>
    </div>
  </dialog>
  <dialog id="references-dialog">
    <h2 id="references-title">References</h2>
    <ul id="references-list"></ul>
    <form method="dialog" class="dialog-actions"><button type="submit">Close</button></form>
  </dialog>
</main>

</body>
</html>
